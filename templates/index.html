<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级穿越模拟器</title>
    <script src="/static/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* 左侧面板 */
        .left-panel {
            width: 300px;
            min-width: 280px;
            background: #16213e;
            border-right: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            overflow-y: auto;
        }

        .left-panel h2 {
            font-size: 18px;
            color: #e94560;
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 1px solid #0f3460;
        }

        .world-info {
            background: #0f3460;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.6;
        }

        .world-info .label {
            color: #e94560;
            font-weight: bold;
        }

        .scene-box {
            background: #0f3460;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.6;
            border-left: 3px solid #e94560;
        }

        .scene-box .scene-title {
            color: #e94560;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .stats-box {
            background: #0f3460;
            border-radius: 10px;
            padding: 12px;
            font-size: 12px;
        }

        .stats-box h3 {
            font-size: 14px;
            color: #e94560;
            margin-bottom: 8px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid #1a1a2e;
        }

        .stat-name { color: #aaa; }
        .stat-value { color: #00ff88; font-weight: bold; }

        .npc-list h3 {
            font-size: 14px;
            color: #e94560;
            margin-bottom: 8px;
        }

        .npc-item {
            background: #0f3460;
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .npc-item:hover { background: #1a3a6e; }
        .npc-item .npc-name { color: #e94560; font-weight: bold; font-size: 13px; }
        .npc-item .npc-detail { color: #aaa; margin-top: 2px; }
        .npc-item.dead { opacity: 0.4; text-decoration: line-through; }
        .npc-item.absent { opacity: 0.5; }

        /* 右侧聊天区 */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
            min-width: 0;
        }

        .chat-header {
            padding: 14px 20px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header .world-title {
            font-size: 18px;
            font-weight: bold;
            color: #e94560;
        }

        .chat-header .scene-name {
            font-size: 13px;
            color: #aaa;
        }

        .end-world-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .end-world-btn:hover { background: #c73e54; }

        .name-edit-btn {
            background: #0f3460;
            color: #ffd700;
            border: 1px solid #0f3460;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .name-edit-btn:hover { border-color: #e94560; color: #e94560; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

        .message {
            display: flex;
            gap: 10px;
            max-width: 80%;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.player { align-self: flex-end; flex-direction: row-reverse; }
        .message.npc { align-self: flex-start; }
        .message.narrator { align-self: center; max-width: 90%; }
        .message.system { align-self: center; }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .avatar.player { background: #e94560; color: white; }
        .avatar.npc { background: #0f3460; color: #00ff88; }
        .avatar.narrator { background: #533483; color: #ffd700; }

        .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }

        .bubble.player {
            background: #e94560;
            color: white;
            border-radius: 16px 4px 16px 16px;
        }

        .bubble.npc {
            background: #0f3460;
            color: #e0e0e0;
            border-radius: 4px 16px 16px 16px;
        }

        .bubble.narrator {
            background: #2a1a3e;
            color: #d4b8ff;
            border-radius: 12px;
            text-align: center;
            font-style: italic;
            border: 1px solid #533483;
        }

        .bubble.narrator.narrator-plot {
            background: #1a2a1e;
            color: #a8d8b8;
            border: 1px solid #2e5e3e;
        }

        .bubble.narrator.narrator-hint {
            background: #2a2a1e;
            color: #e8d888;
            border: 1px solid #5e5e2e;
            font-style: normal;
            font-size: 13px;
        }

        .bubble.narrator.narrator-talent {
            background: #1e2a3e;
            color: #88c8ff;
            border: 1px solid #2e5e6e;
            font-style: normal;
            font-size: 13px;
        }

        .bubble.system {
            background: #333;
            color: #ffd700;
            border-radius: 12px;
            text-align: center;
            font-size: 12px;
        }

        .speaker-name {
            font-size: 11px;
            color: #888;
            margin-bottom: 2px;
        }

        .message.player .speaker-name { text-align: right; }

        .typing-indicator {
            align-self: flex-start;
            display: flex;
            gap: 10px;
            padding: 8px 14px;
            background: #0f3460;
            border-radius: 4px 16px 16px 16px;
            font-size: 13px;
            color: #aaa;
            animation: fadeIn 0.3s;
        }

        .typing-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #e94560;
            margin: 0 2px;
            animation: bounce 1.2s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .thinking-indicator {
            align-self: center;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid rgba(233, 69, 96, 0.25);
            border-radius: 20px;
            font-size: 13px;
            color: #e94560;
            animation: fadeIn 0.3s;
        }

        .thinking-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(233, 69, 96, 0.3);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* 输入区 */
        .chat-input-area {
            padding: 12px 20px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input-area textarea {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 10px 14px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
        }

        .chat-input-area textarea:focus { border-color: #e94560; }

        .chat-input-area button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .chat-input-area button:hover { background: #c73e54; }
        .chat-input-area button:disabled { background: #555; cursor: not-allowed; }

        /* 启动界面 */
        .start-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 50% 30%, #1a2040 0%, #0d0d1a 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            flex-direction: column;
        }

        .start-overlay .start-topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 16px;
            display: flex;
            justify-content: flex-end;
            z-index: 101;
        }

        .start-box {
            background: rgba(22, 33, 62, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px 44px 36px;
            text-align: center;
            max-width: 520px;
            width: 92%;
            border: 1px solid rgba(233, 69, 96, 0.15);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 80px rgba(233,69,96,0.06);
        }

        .start-box .starbrand {
            font-size: 48px;
            margin-bottom: 12px;
            line-height: 1;
        }

        .start-box h1 {
            font-size: 26px;
            color: #e0e0e0;
            margin-bottom: 4px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .start-box .subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        .start-box .section-label {
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .start-box input {
            width: 100%;
            background: rgba(26, 26, 46, 0.7);
            border: 1px solid rgba(15, 52, 96, 0.5);
            border-radius: 12px;
            padding: 13px 18px;
            color: #e0e0e0;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .start-box input:focus { border-color: #e94560; }

        .start-box .btn-start {
            width: 100%;
            background: linear-gradient(135deg, #e94560, #c73e54);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .start-box .btn-start:hover { background: linear-gradient(135deg, #ff5a75, #d94a5e); transform: translateY(-1px); }
        .start-box .btn-start:disabled { background: #333; cursor: not-allowed; transform: none; }

        .mode-select {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .mode-btn {
            flex: 1;
            background: rgba(26, 26, 46, 0.6);
            border: 2px solid rgba(233, 69, 96, 0.3);
            border-radius: 14px;
            padding: 16px 14px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .mode-btn:hover { border-color: rgba(233, 69, 96, 0.6); background: rgba(30, 38, 56, 0.8); }
        .mode-btn.active { border-color: #e94560; background: rgba(26, 8, 32, 0.8); box-shadow: 0 0 20px rgba(233,69,96,0.2); }

        .mode-icon { font-size: 26px; }
        .mode-label { color: #aaa; font-size: 14px; font-weight: bold; transition: color 0.3s; }
        .mode-btn.active .mode-label { color: #e94560; }
        .mode-desc { color: #555; font-size: 11px; transition: color 0.3s; }
        .mode-btn.active .mode-desc { color: #aa5570; }

        .saved-worlds {
            margin-top: 20px;
            text-align: left;
            max-height: 260px;
            overflow-y: auto;
        }

        .saved-title {
            color: #ffd700;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(233,69,96,0.15);
            letter-spacing: 1px;
        }

        .saved-item {
            background: rgba(26, 26, 46, 0.5);
            border: 1px solid rgba(15, 52, 96, 0.3);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .saved-item:hover { border-color: rgba(233,69,96,0.4); background: rgba(30, 38, 56, 0.6); }

        .saved-item .si-info { flex: 1; min-width: 0; }
        .saved-item .si-name { color: #e0e0e0; font-size: 14px; font-weight: bold; }
        .saved-item .si-player { color: #888; font-size: 11px; margin-top: 2px; }
        .saved-item .si-meta { color: #666; font-size: 11px; }
        .saved-item .si-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 8px;
            white-space: nowrap;
            margin-left: 8px;
        }
        .si-badge.ongoing { background: #0f3460; color: #00ff88; }
        .si-badge.ended { background: #333; color: #888; }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* 事件提示 */
        .event-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #e94560;
            color: white;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 200;
            animation: slideDown 0.3s, fadeOut 0.5s 2.5s forwards;
        }

        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-40px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        @keyframes fadeOut { to { opacity: 0; } }

        .start-overlay.hidden { display: none; }

        .settings-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 90;
            background: #16213e;
            border: 1px solid #0f3460;
            color: #aaa;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .settings-btn:hover { color: #e94560; border-color: #e94560; }

        .settings-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 30, 0.9);
            z-index: 160;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .settings-overlay.hidden { display: none; }

        .settings-panel {
            background: #16213e;
            border-radius: 16px;
            width: 90%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid #0f3460;
            padding: 24px;
        }

        .settings-panel h3 {
            color: #e94560;
            font-size: 18px;
            margin-bottom: 20px;
            text-align: center;
        }

        .settings-group {
            margin-bottom: 14px;
        }

        .settings-group label {
            display: block;
            color: #aaa;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .settings-group input, .settings-group select {
            width: 100%;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 8px 12px;
            color: #e0e0e0;
            font-size: 13px;
            outline: none;
        }

        .settings-group input:focus, .settings-group select:focus {
            border-color: #e94560;
        }

        .settings-row {
            display: flex;
            gap: 12px;
        }

        .settings-row .settings-group { flex: 1; }

        .settings-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .settings-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .settings-save {
            background: #e94560;
            color: white;
        }

        .settings-save:hover { background: #c73e54; }

        .settings-cancel {
            background: #333;
            color: #aaa;
        }

        .settings-cancel:hover { background: #444; }

        .novel-btn {
            background: #533483;
            color: #ffd700;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-right: 8px;
        }

        .novel-btn:hover { background: #6a4494; }
        .novel-btn.has-new { animation: glow 1.5s infinite; }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 4px #ffd700; }
            50% { box-shadow: 0 0 16px #ffd700, 0 0 24px #e94560; }
        }

        .novel-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 30, 0.92);
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s;
        }

        .novel-overlay.hidden { display: none; }

        .novel-panel {
            background: #16213e;
            border-radius: 16px;
            width: 90%;
            max-width: 750px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            border: 1px solid #0f3460;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }

        .novel-panel-header {
            padding: 16px 24px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .novel-panel-header h2 {
            color: #ffd700;
            font-size: 20px;
            margin: 0;
        }

        .novel-panel-header .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .novel-panel-header .close-btn:hover { color: #e94560; }

        .novel-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            border-bottom: 1px solid #0f3460;
            padding: 8px 12px;
        }

        .novel-tab {
            padding: 8px 18px;
            cursor: pointer;
            color: #aaa;
            font-size: 14px;
            white-space: nowrap;
            border: 1px solid rgba(15, 52, 96, 0.5);
            border-radius: 8px 8px 0 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            background: rgba(15, 52, 96, 0.25);
            min-width: 70px;
            text-align: center;
        }

        .novel-tab:hover {
            color: #e0e0e0;
            background: rgba(15, 52, 96, 0.5);
            border-color: rgba(233, 69, 96, 0.3);
        }

        .novel-tab.active {
            color: #ffd700;
            border-bottom-color: #e94560;
            background: rgba(233, 69, 96, 0.12);
            border-color: rgba(233, 69, 96, 0.4);
            font-weight: bold;
        }

        .novel-tab.final {
            color: #e94560;
            border-color: rgba(233, 69, 96, 0.3);
        }

        .novel-tab.final.active {
            color: #e94560;
            font-weight: bold;
            border-bottom-color: #e94560;
        }

        .novel-content {
            flex: 1;
            overflow-y: auto;
            padding: 32px 36px;
            color: #c8c0d0;
            font-size: 16px;
            line-height: 2.2;
            font-family: "Noto Serif SC", "STSong", "SimSun", "Microsoft YaHei", serif;
            letter-spacing: 0.5px;
            background: linear-gradient(180deg, rgba(22,33,62,0.6) 0%, rgba(26,26,46,0.9) 100%);
        }

        .novel-content::-webkit-scrollbar { width: 6px; }
        .novel-content::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

        .novel-content .chapter-title {
            font-size: 26px;
            color: #ffd700;
            text-align: center;
            margin-bottom: 4px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255,215,0,0.3);
        }

        .novel-content .chapter-meta {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(233,69,96,0.2);
            letter-spacing: 1px;
        }

        .novel-content p {
            text-indent: 2em;
            margin-bottom: 14px;
        }

        .novel-placeholder {
            text-align: center;
            color: #666;
            padding: 60px 20px;
            font-size: 16px;
            line-height: 2;
        }

        .novel-chapter-badge {
            display: inline-block;
            background: #e94560;
            color: white;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 10px;
            margin-left: 4px;
            vertical-align: middle;
        }

        .talent-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 50% 30%, #1a2040 0%, #0d0d1a 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 120;
            flex-direction: column;
            animation: fadeIn 0.4s;
        }

        .talent-overlay.hidden { display: none; }

        .talent-panel {
            background: rgba(22, 33, 62, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 32px 28px 24px;
            text-align: center;
            max-width: 680px;
            width: 94%;
            border: 1px solid rgba(233, 69, 96, 0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(233,69,96,0.08);

        .talent-panel h2 {
            color: #ffd700;

        }

        .talent-panel .talent-subtitle {
            color: #888;
            font-size: 12px;
            margin-bottom: 16px;

        .talent-panel .talent-cards {

        .talent-card {
            background: rgba(15, 52, 96, 0.5);
            border: 2px solid rgba(15, 52, 96, 0.6);

            transition: all 0.25s;
            text-align: left;
            position: relative;
        }

        .talent-card:hover { border-color: rgba(233, 69, 96, 0.4); background: rgba(25, 60, 100, 0.6); }

        .talent-card.selected {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.15);
            box-shadow: 0 0 16px rgba(233, 69, 96, 0.25);
        }

        .talent-card .talent-type {
            display: inline-block;

            padding: 2px 8px;
