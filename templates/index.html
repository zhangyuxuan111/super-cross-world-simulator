        }

        .talent-type.combat { background: #c0392b; color: #ff6b6b; }
        .talent-type.divine { background: #8e44ad; color: #d4a0ff; }
        .talent-type.curse { background: #2c3e50; color: #ff6b6b; }
        .talent-type.artifact { background: #d4a017; color: #ffd700; }
        .talent-type.cultivation { background: #2471a3; color: #85c1e9; }
        .talent-type.social { background: #1abc9c; color: #a3e4d7; }
        .talent-type.mystical { background: #6c3483; color: #d7bde2; }
        .talent-type.survival { background: #1e8449; color: #a9dfbf; }
        .talent-type.combat { background: #c0392b; color: #f1948a; }
        .talent-type.mental { background: #2e86c1; color: #a9cce3; }
        .talent-type.tech { background: #17a589; color: #a3e4d7; }
        .talent-type.luck { background: #d68910; color: #f9e79f; }
        .talent-type.wealth { background: #d4ac0d; color: #f9e79f; }
        .talent-type.bloodline { background: #943126; color: #f5b7b1; }
        .talent-type.magic { background: #5b2c6f; color: #d7bde2; }
        .talent-type.stealth { background: #1b4f72; color: #a9cce3; }
        .talent-type.healing { background: #28b463; color: #a9dfbf; }
        .talent-type.instinct { background: #9c640c; color: #f9e79f; }
        .talent-type.destiny { background: #6c3483; color: #d4a0ff; }
        .talent-type.personality { background: #5d6d7e; color: #d5d8dc; }
        .talent-type.crafting { background: #b7950b; color: #fcf3cf; }

        .talent-card .talent-name {
            color: #e0e0e0;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .talent-card .talent-desc {
            color: #999;
            font-size: 12px;
            line-height: 1.5;
        }

        .talent-card .talent-check {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.2s;
        }

        .talent-card.selected .talent-check {
            border-color: #e94560;
            background: #e94560;
            color: white;
        }

        .talent-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .talent-actions .btn-confirm {
            background: linear-gradient(135deg, #e94560, #c73e54);
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .talent-actions .btn-confirm:hover { background: linear-gradient(135deg, #ff5a75, #d94a5e); transform: translateY(-1px); }
        .talent-actions .btn-confirm:disabled { background: #333; cursor: not-allowed; transform: none; }

        .talent-actions .btn-reroll {
            background: rgba(15, 52, 96, 0.5);
            border: 1px solid #0f3460;
            color: #aaa;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .talent-actions .btn-reroll:hover { border-color: #e94560; color: #e94560; }
    </style>
</head>
<body>
    <div class="start-overlay" id="startOverlay">
        <div class="start-topbar">
            <button class="settings-btn" onclick="openSettings()" style="position:static;" title="模型设置">⚙</button>
        </div>
        <div class="start-box">
            <div class="starbrand">🌌</div>
            <h1>超级穿越模拟器</h1>
            <p class="subtitle">AI · 沉浸式角色扮演世界</p>

            <div class="section-label">选择体验模式</div>
            <div class="mode-select">
                <button class="mode-btn active" id="modeNormal" onclick="selectMode('normal')">
                    <span class="mode-icon">🎭</span>
                    <span class="mode-label">常规扮演</span>
                    <span class="mode-desc">信息透明 · 展示世界观和角色性格</span>
                </button>
                <button class="mode-btn" id="modeImmersive" onclick="selectMode('immersive')">
                    <span class="mode-icon">🔮</span>
                    <span class="mode-label">深度体验</span>
                    <span class="mode-desc">感官描写 · 用视觉听觉触觉感受世界</span>
                </button>
            </div>

            <div class="section-label" style="margin-top: 4px;">你的姓名（可选）</div>
            <input type="text" id="playerNameInput"
                   placeholder="留空则由AI自动生成..." maxlength="8">

            <div class="section-label" style="margin-top: 4px;">世界偏好（可选）</div>
            <input type="text" id="suggestionInput"
                   placeholder="例如：我想去一个魔法与科技并存的世界...">
            <button class="btn-start" id="startBtn" onclick="startWorld()">开始穿越</button>

            <div class="saved-worlds" id="savedWorlds" style="display:none;">
                <div class="saved-title">📂 继续冒险</div>
                <div class="saved-list" id="savedList"></div>
            </div>
        </div>
    </div>

    <div class="talent-overlay hidden" id="talentOverlay">
        <div class="talent-panel">
            <h2>✨ 命运天赋</h2>
            <p class="talent-subtitle">选择 <span style="color:#e94560;">3个</span> 天赋伴随你的穿越之旅（已选 <span id="talentSelectedCount" style="color:#ffd700;">0</span>/3）</p>
            <div class="talent-cards" id="talentCards"></div>
             <div class="talent-actions">
                <button class="btn-confirm" id="talentConfirmBtn" onclick="confirmTalents()" disabled>确认天赋并开始穿越</button>
            </div>
        </div>
    </div>

    <div class="novel-overlay hidden" id="novelOverlay">
        <div class="novel-panel">
            <div class="novel-panel-header">
                <h2>📖 <span id="novelWorldTitle">冒险故事</span></h2>
                <button class="close-btn" onclick="closeNovel()">✕</button>
            </div>
            <div class="novel-tabs" id="novelTabs">
            </div>
            <div class="novel-content" id="novelContent">
                <div class="novel-placeholder">
                    冒险还未开始，小说尚未书写...<br>
                    在世界中展开对话与行动，AI会将你的冒险写成小说。
                </div>
            </div>
        </div>
    </div>

    <div class="settings-overlay hidden" id="settingsOverlay">
        <div class="settings-panel">
            <h3>⚙️ 模型设置</h3>
            <div class="settings-group">
                <label>API Key</label>
                <input type="password" id="setApiKey" placeholder="留空则使用默认Key">
            </div>
            <div class="settings-group">
                <label>API URL</label>
                <input type="text" id="setApiUrl" placeholder="https://api.deepseek.com/v1/chat/completions">
            </div>
            <div class="settings-row">
                <div class="settings-group">
                    <label>推理模型</label>
                    <input type="text" id="setModelReasoner" placeholder="deepseek-v4-pro">
                </div>
                <div class="settings-group">
                    <label>对话模型</label>
                    <input type="text" id="setModelChat" placeholder="deepseek-v4-flash">
                </div>
            </div>
            <h3 style="margin-top:20px;">🌡️ 温度参数</h3>
            <div class="settings-row">
                <div class="settings-group">
                    <label>创意生成</label>
                    <input type="number" id="setTempCreative" step="0.05" min="0" max="2" placeholder="0.95">
                </div>
                <div class="settings-group">
                    <label>叙事/情节</label>
                    <input type="number" id="setTempNarrative" step="0.05" min="0" max="2" placeholder="0.85">
                </div>
            </div>
            <div class="settings-row">
                <div class="settings-group">
                    <label>角色对话</label>
                    <input type="number" id="setTempDialogue" step="0.05" min="0" max="2" placeholder="0.8">
                </div>
                <div class="settings-group">
                    <label>场景导演</label>
                    <input type="number" id="setTempDirector" step="0.05" min="0" max="2" placeholder="0.3">
                </div>
            </div>
            <div class="settings-group">
                <label>小说生成</label>
                <input type="number" id="setTempNovel" step="0.05" min="0" max="2" placeholder="0.9">
            </div>
            <h3 style="margin-top:20px;">📏 Max Tokens</h3>
            <div class="settings-row">
                <div class="settings-group">
                    <label>世界观生成</label>
                    <input type="number" id="setTokensWorld" step="256" min="256" placeholder="4096">
                </div>
                <div class="settings-group">
                    <label>情节推进</label>
                    <input type="number" id="setTokensPlot" step="256" min="256" placeholder="4096">
                </div>
            </div>
            <div class="settings-row">
                <div class="settings-group">
                    <label>角色对话</label>
                    <input type="number" id="setTokensDialogue" step="256" min="256" placeholder="2048">
                </div>
                <div class="settings-group">
                    <label>旁白叙述</label>
                    <input type="number" id="setTokensNarrator" step="256" min="256" placeholder="2048">
                </div>
            </div>
            <div class="settings-row">
                <div class="settings-group">
                    <label>场景导演</label>
                    <input type="number" id="setTokensDirector" step="256" min="256" placeholder="1024">
                </div>
                <div class="settings-group">
                    <label>小说生成</label>
                    <input type="number" id="setTokensNovel" step="256" min="256" placeholder="4096">
                </div>
            </div>
            <div class="settings-actions">
                <button class="settings-cancel" onclick="closeSettings()">取消</button>
                <button class="settings-save" onclick="saveSettings()">保存并重启生效</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="left-panel" id="leftPanel">
            <h2>🌍 世界面板</h2>
            <div class="world-info" id="worldInfo">
                <p><span class="label">世界：</span><span id="worldName">---</span></p>
                <p><span class="label">主题：</span><span id="worldTheme">---</span></p>
                <p style="margin-top:6px;"><span id="worldDesc">等待世界生成...</span></p>
            </div>
            <div class="scene-box" id="sceneBox">
                <div class="scene-title">📍 <span id="sceneName">---</span></div>
                <p id="sceneDesc"></p>
            </div>
            <div class="stats-box" id="statsBox">
                <h3>📊 主角属性</h3>
                <div id="statsContent">
                    <p style="color:#aaa;">等待角色创建...</p>
                </div>
            </div>
            <div class="npc-list" id="npcList">
                <h3>👥 在场角色</h3>
                <div id="npcContent"></div>
            </div>
        </div>

        <div class="right-panel">
            <div class="chat-header">
                <div>
                    <div class="world-title" id="headerWorldTitle">超级穿越模拟器</div>
                    <div class="scene-name" id="headerSceneName">等待世界生成...</div>
                </div>
                <div style="display:flex;align-items:center;gap:6px;">
                    <button class="name-edit-btn" id="nameEditBtn" onclick="editPlayerName()" style="display:none;" title="修改姓名">✏️</button>
                    <button class="novel-btn" id="novelBtn" onclick="openNovel()" style="display:none;">
                        📖 小说
                    </button>
                    <button class="end-world-btn" onclick="endWorld()" id="endWorldBtn" style="display:none;">
                        结束世界
                    </button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message system">
                    <div class="bubble system">点击「开始穿越」进入你的冒险世界</div>
                </div>
            </div>

            <div class="chat-input-area">
                <textarea id="messageInput" placeholder="输入你的行动或对话..."
                          rows="1" onkeydown="handleKeyDown(event)" disabled></textarea>
                <button id="sendBtn" onclick="sendMessage()" disabled>发送</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let isProcessing = false;
        let playerName = "";
        let novelChapters = [];
        let currentMode = "normal";
        let currentWorldId = null;

        function selectMode(mode) {
            currentMode = mode;
            document.getElementById("modeNormal").classList.toggle("active", mode === "normal");
            document.getElementById("modeImmersive").classList.toggle("active", mode === "immersive");
        }

        function openSettings() {
            document.getElementById("settingsOverlay").classList.remove("hidden");
            fetchSettings();
        }

        function closeSettings() {
            document.getElementById("settingsOverlay").classList.add("hidden");
        }

        function fetchSettings() {
            fetch("/api/settings")
                .then(r => r.json())
                .then(data => {
                    if (!data.success) return;
                    const s = data.settings;
                    setVal("setApiKey", s.api_key);
                    setVal("setApiUrl", s.api_url);
                    setVal("setModelReasoner", s.model_reasoner);
                    setVal("setModelChat", s.model_chat);
                    setVal("setTempCreative", s.temperature_creative);
                    setVal("setTempNarrative", s.temperature_narrative);
                    setVal("setTempDialogue", s.temperature_dialogue);
                    setVal("setTempDirector", s.temperature_director);
                    setVal("setTempNovel", s.temperature_novel);
                    setVal("setTokensWorld", s.max_tokens_world);
                    setVal("setTokensPlot", s.max_tokens_plot);
                    setVal("setTokensDialogue", s.max_tokens_dialogue);
                    setVal("setTokensNarrator", s.max_tokens_narrator);
                    setVal("setTokensDirector", s.max_tokens_director);
                    setVal("setTokensNovel", s.max_tokens_novel);
                });
        }

        function setVal(id, val) {
            const el = document.getElementById(id);
            if (el && val !== undefined && val !== null && val !== "") {
                el.value = val;
            }
        }

        function saveSettings() {
            const payload = {
                api_key: document.getElementById("setApiKey").value,
                api_url: document.getElementById("setApiUrl").value,
                model_reasoner: document.getElementById("setModelReasoner").value,
                model_chat: document.getElementById("setModelChat").value,
                temperature_creative: parseFloat(document.getElementById("setTempCreative").value) || null,
                temperature_narrative: parseFloat(document.getElementById("setTempNarrative").value) || null,
                temperature_dialogue: parseFloat(document.getElementById("setTempDialogue").value) || null,
                temperature_director: parseFloat(document.getElementById("setTempDirector").value) || null,
                temperature_novel: parseFloat(document.getElementById("setTempNovel").value) || null,
                max_tokens_world: parseInt(document.getElementById("setTokensWorld").value) || null,
                max_tokens_plot: parseInt(document.getElementById("setTokensPlot").value) || null,
                max_tokens_dialogue: parseInt(document.getElementById("setTokensDialogue").value) || null,
                max_tokens_narrator: parseInt(document.getElementById("setTokensNarrator").value) || null,
                max_tokens_director: parseInt(document.getElementById("setTokensDirector").value) || null,
                max_tokens_novel: parseInt(document.getElementById("setTokensNovel").value) || null,
            };

            fetch("/api/settings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    alert("设置已保存！请重启服务器以应用更改。");
                    closeSettings();
                } else {
                    alert("保存失败：" + (data.error || "未知错误"));
                }
            });
        }

        function fetchSavedWorlds() {
            fetch("/api/worlds")
                .then(r => r.json())
                .then(data => {
                    if (!data.success || !data.worlds.length) return;
                    const container = document.getElementById("savedWorlds");
                    container.style.display = "block";
                    let html = "";
                    data.worlds.forEach(w => {
                        const modeBadge = w.mode === "immersive"
                            ? '<span class="si-badge ongoing">🔮</span>'
                            : '<span class="si-badge ongoing">🎭</span>';
                        const badge = w.is_active
                            ? `<span class="si-badge ongoing">进行中</span>`
                            : `<span class="si-badge ended">已结束</span>`;
                        html += `<div class="saved-item" onclick="loadWorld(${w.id})">
                            <div class="si-info">
                                <div class="si-name">${escapeHtml(w.name)}</div>
                                <div class="si-player">${modeBadge} ${escapeHtml(w.player_name)} · ${escapeHtml(w.theme)}</div>
                                <div class="si-meta">💬 ${w.message_count}条对话 · 📖 ${w.chapter_count}章小说</div>
                            </div>
                            ${badge}
                        </div>`;
                    });
                    document.getElementById("savedList").innerHTML = html;
                })
                .catch(() => {});
        }

        function loadWorld(worldId) {
            const btn = document.getElementById("startBtn");
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span>加载世界中...';

            fetch(`/api/world/load/${worldId}`, { method: "POST" })
                .then(r => r.json())
                .then(data => {
                    if (!data.success) {
                        alert("加载失败：" + (data.error || "未知错误"));
                        btn.disabled = false;
                        btn.textContent = "开始穿越";
                        return;
                    }

                    currentWorldId = data.world.id;
                    const mode = data.world.mode || "normal";
                    const isImmersive = mode === "immersive";
                    currentMode = mode;
                    socket.emit("register_session", { world_id: currentWorldId, mode: mode });

                    document.getElementById("startOverlay").classList.add("hidden");
                    document.getElementById("endWorldBtn").style.display = "block";
                    document.getElementById("novelBtn").style.display = "inline-block";
                    document.getElementById("nameEditBtn").style.display = "inline-block";
                    document.getElementById("novelWorldTitle").textContent = data.world.name;
                    document.getElementById("messageInput").disabled = false;
                    document.getElementById("sendBtn").disabled = false;

                    if (isImmersive) {
                        document.getElementById("worldName").textContent = data.world.name;
                        document.getElementById("worldTheme").textContent = data.world.theme;
                        document.getElementById("worldDesc").textContent = data.world.scene_description;
                        document.getElementById("sceneName").textContent = data.world.current_scene;
                        document.getElementById("sceneDesc").textContent = "";
                        document.getElementById("headerWorldTitle").textContent = "🌌 " + data.world.name;
                        document.getElementById("headerSceneName").textContent = "📍 " + data.world.current_scene;
                        document.getElementById("worldInfo").querySelectorAll("p")[0].style.display = "none";
                        document.getElementById("statsBox").style.display = "none";
                        let npcHtml = "";
                        data.npcs.forEach(npc => {
                            npcHtml += `<div class="npc-item">
                                <div class="npc-name">${npc.name}</div>
                                <div class="npc-detail">${npc.appearance || ""}</div>
                            </div>`;
                        });
                        document.getElementById("npcContent").innerHTML = npcHtml || '<p style="color:#aaa;">暂无可见身影</p>';
                    } else {
                        document.getElementById("worldInfo").querySelectorAll("p")[0].style.display = "";
                        document.getElementById("statsBox").style.display = "";
                        updateWorldInfo(data.world);
                        updateNPCList(data.npcs);
                    }

                    if (data.player) { updatePlayerStats(data.player); playerName = data.player.name; }

                    document.getElementById("chatMessages").innerHTML = "";
                    if (isImmersive) {
                        addMessage("system", "系统", `你是「${playerName}」。注意观察你周围的一切。`);
                    } else {
                        addMessage("system", "系统", `继续冒险：世界「${data.world.name}」· 你是「${playerName}」。`);
                    }

                    if (data.messages) {
                        data.messages.forEach(m => {
                            if (m.speaker_type === "narrator") {
                                addNarration(m.content);
                            } else if (m.speaker_type === "player") {
                                addMessage("player", m.speaker_name, m.content);
                            } else if (m.speaker_type === "npc") {
                                addMessage("npc", m.speaker_name, m.content);
                            } else {
                                addMessage("system", m.speaker_name, m.content);
                            }
                        });
                    }

                    document.getElementById("messageInput").focus();
                })
                .catch(err => {
                    alert("请求失败：" + err.message);
                    btn.disabled = false;
                    btn.textContent = "开始穿越";
                });
        }

        fetchSavedWorlds();

        let selectedTalents = [];
        let currentTalents = [];
        let worldStartData = null;
        let worldStartPromise = null;
        let worldStartDone = false;

        function showTalentSelection() {
            selectedTalents = [];
            updateTalentCount();
            document.getElementById("talentConfirmBtn").disabled = true;

            fetch("/api/talents/random")
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        currentTalents = data.talents;
                        renderTalentCards();
                        document.getElementById("talentOverlay").classList.remove("hidden");
                        document.getElementById("startBtn").disabled = false;
                        document.getElementById("startBtn").textContent = "开始穿越";
                    }
                })
                .catch(() => {
                    document.getElementById("startBtn").disabled = false;
                    document.getElementById("startBtn").textContent = "开始穿越";
                });
        }

        function renderTalentCards() {
            const container = document.getElementById("talentCards");
            const typeNames = {
                combat: "战斗", divine: "神性", curse: "诅咒", artifact: "宝物",
                cultivation: "修仙", social: "社交", mystical: "秘术", survival: "生存",
                mental: "心智", tech: "科技", luck: "运气", wealth: "财富",
                bloodline: "血脉", magic: "魔法", stealth: "潜行", healing: "治愈",
                instinct: "本能", destiny: "命格", personality: "性格", crafting: "锻造"
            };
            let html = "";
            currentTalents.forEach((t, i) => {
                const isSel = selectedTalents.some(st => st.name === t.name);
                const typeName = typeNames[t.type] || t.type;
                html += `<div class="talent-card${isSel ? ' selected' : ''}" onclick="toggleTalent(${i})">
                    <span class="talent-type ${t.type}">${typeName}</span>
                    <div class="talent-name">${escapeHtml(t.name)}</div>
                    <div class="talent-desc">${escapeHtml(t.desc)}</div>
                    <div class="talent-check">${isSel ? '✓' : ''}</div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function toggleTalent(index) {
            const talent = currentTalents[index];
            if (!talent) return;
            const alreadySelected = selectedTalents.some(st => st.name === talent.name);
            if (alreadySelected) {
                selectedTalents = selectedTalents.filter(st => st.name !== talent.name);
            } else {
                if (selectedTalents.length >= 3) {
                    selectedTalents.shift();
                }
                selectedTalents.push(talent);
            }
            renderTalentCards();
            updateTalentCount();
            document.getElementById("talentConfirmBtn").disabled = (selectedTalents.length !== 3);
        }

        function updateTalentCount() {
            document.getElementById("talentSelectedCount").textContent = selectedTalents.length;
        }

        function confirmTalents() {
            if (selectedTalents.length !== 3) return;
            document.getElementById("talentOverlay").classList.add("hidden");
            document.getElementById("startBtn").disabled = true;
            document.getElementById("startBtn").innerHTML = '<span class="loading-spinner"></span>正在融合天赋...';

            const playerNameInput = document.getElementById("playerNameInput").value.trim();

            function finalizeAndOpen() {
                fetch("/api/world/apply_talents", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        talents: selectedTalents,
                        player_name: playerNameInput
                    })
                })
                .then(r => r.json())
                .then(talentResult => {
                    if (!talentResult.success) {
                        alert("天赋应用失败：" + (talentResult.error || "未知错误"));
                        document.getElementById("startBtn").disabled = false;
                        document.getElementById("startBtn").textContent = "开始穿越";
                        return;
                    }

                    if (worldStartData) {
                        worldStartData.player = talentResult.player;
                    }

                    openWorldWithData(worldStartData);
                })
                .catch(err => {
                    alert("请求失败：" + err.message);
                    document.getElementById("startBtn").disabled = false;
                    document.getElementById("startBtn").textContent = "开始穿越";
                });
            }

            if (worldStartDone && worldStartData) {
                finalizeAndOpen();
            } else if (worldStartPromise) {
                document.getElementById("startBtn").innerHTML = '<span class="loading-spinner"></span>等待世界生成...';
                worldStartPromise.then(() => {
                    finalizeAndOpen();
                });
            } else {
                alert("世界尚未开始生成，请重试");
                document.getElementById("startBtn").disabled = false;
                document.getElementById("startBtn").textContent = "开始穿越";
            }
        }

        function startWorld() {
            const btn = document.getElementById("startBtn");
            const suggestion = document.getElementById("suggestionInput").value;
            const mode = currentMode;
            worldStartData = null;
            worldStartPromise = null;
            worldStartDone = false;

            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span>世界与天赋双线加载中...';

            worldStartPromise = fetch("/api/world/start", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    suggestion: suggestion,
                    mode: mode,
                    player_name: document.getElementById("playerNameInput").value.trim(),
                    talents: []
                })
            })
            .then(r => r.json())
            .then(data => {
                if (!data.success) {
                    alert("生成失败：" + (data.error || "未知错误"));
                    btn.disabled = false;
                    btn.textContent = "开始穿越";
                    worldStartPromise = null;
                    return;
                }
                worldStartData = data;
                worldStartDone = true;
                document.getElementById("talentConfirmBtn").textContent = "确认天赋并开始穿越";
            })
            .catch(err => {
                alert("请求失败：" + err.message);
                btn.disabled = false;
                btn.textContent = "开始穿越";
                worldStartPromise = null;
            });

            showTalentSelection();
        }

        function openWorldWithData(data) {
            if (!data) return;
            const btn = document.getElementById("startBtn");
            const mode = data.mode || currentMode;

            currentWorldId = data.world.id;

            socket.emit("register_session", { world_id: currentWorldId, mode: mode });

            document.getElementById("startOverlay").classList.add("hidden");
            document.getElementById("endWorldBtn").style.display = "block";
            document.getElementById("novelBtn").style.display = "inline-block";
            document.getElementById("nameEditBtn").style.display = "inline-block";
            document.getElementById("novelWorldTitle").textContent = data.world.name;
            document.getElementById("messageInput").disabled = false;
            document.getElementById("sendBtn").disabled = false;

            const isImmersive = mode === "immersive";

            if (isImmersive) {
                document.getElementById("worldName").textContent = data.world.name;
                document.getElementById("worldTheme").textContent = data.world.theme;
                document.getElementById("worldDesc").textContent = data.world.scene_description;
                document.getElementById("sceneName").textContent = data.world.current_scene;
                document.getElementById("sceneDesc").textContent = "";
                document.getElementById("headerWorldTitle").textContent = "🌌 " + data.world.name;
                document.getElementById("headerSceneName").textContent = "📍 " + data.world.current_scene;
                document.getElementById("worldInfo").querySelectorAll("p")[0].style.display = "none";
                document.getElementById("statsBox").style.display = "none";
                document.getElementById("npcContent").innerHTML = "";
                if (data.npcs_immersive) {
                    let npcHtml = "";
                    data.npcs_immersive.forEach(npc => {
                        npcHtml += `<div class="npc-item">
                            <div class="npc-name">${npc.name}</div>
                            <div class="npc-detail">${npc.appearance || ""}</div>
                        </div>`;
                    });
                    document.getElementById("npcContent").innerHTML = npcHtml || '<p style="color:#aaa;">暂无可见身影</p>';
                }
            } else {
                document.getElementById("worldInfo").querySelectorAll("p")[0].style.display = "";
                document.getElementById("statsBox").style.display = "";
                updateWorldInfo(data.world);
                updateNPCList(data.npcs);
            }

            if (data.player) {
                updatePlayerStats(data.player);
                playerName = data.player.name;
            }

            document.getElementById("chatMessages").innerHTML = "";

            if (isImmersive) {
                addMessage("system", "系统", `你是「${playerName}」。注意观察你周围的一切。`);
            } else {
                addMessage("system", "系统", `世界「${data.world.name}」已生成。你是「${playerName}」。`);
            }

            addNarration(data.narration);

            if (!isImmersive) {
                data.npcs.forEach(npc => {
                    addMessage("system", "系统",
                        `👤 ${npc.name} - ${npc.personality}`);
                });
            }

            document.getElementById("messageInput").focus();
        }

        function endWorld() {
            const worldName = document.getElementById("novelWorldTitle").textContent || "当前世界";
            const userInput = prompt(
                `⚠️ 此操作将永久删除「${worldName}」的 所有数据！\n\n包括：角色、对话记录、小说章节、情节事件等。\n此操作不可恢复！\n\n输入 DELETE 确认删除：`,
                ""
            );
            if (userInput !== "DELETE") {
                if (userInput !== null) alert("操作已取消。如需删除请输入 DELETE。");
                return;
            }

            document.getElementById("endWorldBtn").disabled = true;
            document.getElementById("endWorldBtn").textContent = "删除中...";

            fetch("/api/world/end", { method: "POST" })
            .then(r => r.json())
            .then(data => {
                if (!data.success) {
                    alert("删除失败：" + (data.error || "未知错误"));
                    document.getElementById("endWorldBtn").disabled = false;
                    document.getElementById("endWorldBtn").textContent = "结束世界";
                    return;
                }
                currentWorldId = null;
                document.getElementById("startOverlay").classList.remove("hidden");
                document.getElementById("endWorldBtn").style.display = "none";
                document.getElementById("novelBtn").style.display = "none";
                document.getElementById("nameEditBtn").style.display = "none";
                document.getElementById("messageInput").disabled = true;
                document.getElementById("sendBtn").disabled = true;
                document.getElementById("startBtn").disabled = false;
                document.getElementById("startBtn").textContent = "开始穿越";
                document.getElementById("statsBox").style.display = "";
                document.getElementById("worldInfo").querySelectorAll("p")[0].style.display = "";
                document.getElementById("chatMessages").innerHTML =
                    '<div class="message system"><div class="bubble system">世界已永久删除。开始新的冒险吧。</div></div>';
                fetchSavedWorlds();
            })
            .catch(() => {
                alert("删除请求失败，请刷新页面重试");
                document.getElementById("endWorldBtn").disabled = false;
                document.getElementById("endWorldBtn").textContent = "结束世界";
            });
        }

        function editPlayerName() {
            const currentName = playerName || "";
            const newName = prompt("输入新的姓名（1-8字）：", currentName);
            if (!newName || !newName.trim() || newName.trim() === currentName) return;
            const name = newName.trim();
            if (name.length > 8) { alert("姓名不能超过8个字"); return; }

            fetch("/api/player/name", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: name })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    playerName = name;
                    showToast(`姓名已修改为「${name}」`);
                } else {
                    alert(data.error || "修改失败");
                }
            });
        }

        function updateWorldInfo(world) {
            document.getElementById("worldName").textContent = world.name;
            document.getElementById("worldTheme").textContent = world.theme;
            document.getElementById("worldDesc").textContent = world.description;
            document.getElementById("sceneName").textContent = world.current_scene;
            document.getElementById("sceneDesc").textContent = world.scene_description;
            document.getElementById("headerWorldTitle").textContent = "🌌 " + world.name;
            document.getElementById("headerSceneName").textContent = "📍 " + world.current_scene;
        }

        function updatePlayerStats(player) {
            if (!player || !player.stats) return;
            let stats = player.stats;
            if (typeof stats === "string") {
                try { stats = JSON.parse(stats); } catch(e) { return; }
            }
            if (Object.keys(stats).length === 0) return;

            const basicStats = ["hp", "max_hp", "strength", "intelligence", "charisma", "agility", "luck", "sanity"];
            const names = {
                hp: "生命值", max_hp: "最大生命", strength: "力量",
                intelligence: "智力", charisma: "魅力", agility: "敏捷",
                luck: "幸运", sanity: "理智"
            };
            let html = "";
            basicStats.forEach(key => {
                if (stats[key] !== undefined) {
                    html += `<div class="stat-row"><span class="stat-name">${names[key] || key}</span><span class="stat-value">${stats[key]}</span></div>`;
                }
            });
            const extras = { defense: "防御", gold: "金币", spiritual_power: "灵力" };
            Object.keys(extras).forEach(key => {
                if (stats[key] !== undefined && stats[key] !== 0) {
                    html += `<div class="stat-row"><span class="stat-name">${extras[key]}</span><span class="stat-value">${stats[key]}</span></div>`;
                }
            });
            if (stats.inventory && stats.inventory.length > 0) {
                html += `<div class="stat-row"><span class="stat-name">物品</span><span class="stat-value">${stats.inventory.join(", ")}</span></div>`;
            }
            if (stats.skills && stats.skills.length > 0) {
                html += `<div class="stat-row"><span class="stat-name">技能</span><span class="stat-value">${stats.skills.join(", ")}</span></div>`;
            }
            if (stats.talents && stats.talents.length > 0) {
                const talentNames = stats.talents.map(t => t.name).join(" · ");
                html += `<div class="stat-row"><span class="stat-name">天赋</span><span class="stat-value" style="color:#ffd700;">${talentNames}</span></div>`;
            }
            if (stats.status_effects && stats.status_effects.length > 0) {
                html += `<div class="stat-row"><span class="stat-name">状态</span><span class="stat-value" style="color:#e94560;">${stats.status_effects.join(", ")}</span></div>`;
            }
            document.getElementById("statsContent").innerHTML = html || "<p style='color:#aaa;'>无数据</p>";
        }

        function updateNPCList(npcs) {
            let html = "";
            npcs.forEach(npc => {
                let cls = "npc-item";
                if (!npc.is_alive) cls += " dead";
                else if (!npc.is_present) cls += " absent";
                html += `<div class="${cls}">
                    <div class="npc-name">${npc.is_alive ? "🟢" : "💀"} ${npc.name}</div>
                    <div class="npc-detail">${npc.personality}</div>
                </div>`;
            });
            document.getElementById("npcContent").innerHTML = html || "<p style='color:#aaa;'>暂无角色</p>";
        }

        function addMessage(type, name, content, action, narratorType = null) {
            const container = document.getElementById("chatMessages");
            const div = document.createElement("div");
            div.className = "message " + type;

            let avatarClass = type === "player" ? "player" : (type === "narrator" ? "narrator" : "npc");
            let avatarText = name.charAt(0);

            if (type === "player") {
                div.innerHTML = `
                    <div class="avatar ${avatarClass}">${avatarText}</div>
                    <div>
                        <div class="speaker-name" style="text-align:right;">${name}</div>
                        <div class="bubble ${type}">${escapeHtml(content)}</div>
                    </div>`;
            } else if (type === "narrator") {
                const nType = narratorType || "action";
                const prefixMap = { action: "🎭", plot: "⚡", hint: "💡", talent: "✨" };
                const prefix = prefixMap[nType] || "📖";
                const nClassMap = { plot: "narrator-plot", hint: "narrator-hint", talent: "narrator-talent" };
                const nClass = nClassMap[nType] || "";
                div.innerHTML = `
                    <div class="bubble ${type} ${nClass}">${prefix} ${escapeHtml(content)}</div>`;
            } else {
                div.innerHTML = `
                    <div class="avatar ${avatarClass}">${avatarText}</div>
                    <div>
                        <div class="speaker-name">${name}</div>
                        <div class="bubble ${type}">${escapeHtml(content)}</div>
                    </div>`;
            }

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addNarration(text, narratorType = "action") {
            if (!text) return;
            const paragraphs = text.split("\n").filter(p => p.trim());
            paragraphs.forEach(p => {
                addMessage("narrator", "旁白", p.trim(), null, narratorType);
            });
        }

        function showTyping(name) {
            const container = document.getElementById("chatMessages");
            const div = document.createElement("div");
            div.className = "typing-indicator";
            div.id = "typing-" + name;
            div.innerHTML = `
                <span>${name} 正在输入</span>
                <span class="typing-dots"><span></span><span></span><span></span></span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function removeTyping(name) {
            const el = document.getElementById("typing-" + name);
            if (el) el.remove();
        }

        function showThinking() {
            const container = document.getElementById("chatMessages");
            const div = document.createElement("div");
            div.className = "thinking-indicator";
            div.id = "thinking-indicator";
            div.innerHTML = `
                <span class="thinking-spinner"></span>
                <span>AI 正在思考...</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function removeThinking() {
            const el = document.getElementById("thinking-indicator");
            if (el) el.remove();
        }

        function sendMessage() {
            if (isProcessing) return;
            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if (!text) return;

            isProcessing = true;
            document.getElementById("sendBtn").disabled = true;
            input.value = "";
            input.style.height = "auto";

            addMessage("player", playerName || "你", text);
            showThinking();
            socket.emit("user_message", { text: text });
        }

        function handleKeyDown(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message) {
            const toast = document.createElement("div");
            toast.className = "event-toast";
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function openNovel() {
            document.getElementById("novelOverlay").classList.remove("hidden");
            document.getElementById("novelBtn").classList.remove("has-new");
            fetchNovelChapters();
        }

        function closeNovel() {
            document.getElementById("novelOverlay").classList.add("hidden");
        }

        function fetchNovelChapters() {
            fetch("/api/novel/chapters")
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        novelChapters = data.chapters;
                        renderNovelTabs();
                    }
                })
                .catch(err => console.error("获取小说失败:", err));
        }

        function renderNovelTabs() {
            const tabsContainer = document.getElementById("novelTabs");
            const contentContainer = document.getElementById("novelContent");

            let tabsHtml = "";
            novelChapters.forEach((ch, i) => {
                const isFinal = ch.is_final ? " final" : "";
                tabsHtml += `<div class="novel-tab${isFinal}" onclick="showNovelChapter(${i})" id="novelTab${i}">
                    第${ch.chapter_num}章
                </div>`;
            });
            tabsContainer.innerHTML = tabsHtml;

            if (novelChapters.length > 0) {
                showNovelChapter(novelChapters.length - 1);
            } else {
                contentContainer.innerHTML = '<div class="novel-placeholder">冒险还未开始，小说尚未书写...<br>在世界中展开对话与行动，AI会将你的冒险写成小说。</div>';
            }
        }

        function showNovelChapter(index) {
            const ch = novelChapters[index];
            if (!ch) return;

            document.querySelectorAll(".novel-tab").forEach(t => t.classList.remove("active"));
            const tab = document.getElementById("novelTab" + index);
            if (tab) tab.classList.add("active");

            const contentContainer = document.getElementById("novelContent");
            const paragraphs = ch.content.split("\n").filter(p => p.trim());

            let html = `<div class="chapter-title">${escapeHtml(ch.title)}</div>`;
            html += `<div class="chapter-meta">
                ${ch.is_final ? "【终章】" : ""} 第${ch.chapter_num}章
                ${ch.summary ? " · " + escapeHtml(ch.summary) : ""}
            </div>`;
            paragraphs.forEach(p => {
                html += `<p>${escapeHtml(p.trim())}</p>`;
            });
            contentContainer.innerHTML = html;
            contentContainer.scrollTop = 0;
        }

        // Socket events
        socket.on("message_sent", (data) => {
            // 用户消息已由本地添加
        });

        socket.on("typing", (data) => {
            showTyping(data.name);
        });

        socket.on("npc_message", (data) => {
            removeTyping(data.speaker_name);
            addMessage("npc", data.speaker_name, data.content, data.action);
        });

        socket.on("narrator_message", (data) => {
            const ntype = data.narrator_type || "action";
            addNarration(data.content, ntype);
        });

        socket.on("character_change", (data) => {
            if (data.type === "die") {
                showToast(`💀 ${data.name} 死亡 - ${data.reason}`);
            } else if (data.type === "leave") {
                showToast(`🚶 ${data.name} 离开了 - ${data.reason}`);
            } else if (data.type === "appear") {
                showToast(`👋 ${data.name} 出现了 - ${data.reason}`);
            } else if (data.type === "revive") {
                showToast(`✨ ${data.name} 复活了 - ${data.reason}`);
            }
            socket.emit("get_state");
        });

        socket.on("state", (data) => {
            if (!data.has_world) return;

            const isImmersive = data.mode === "immersive";

            if (isImmersive) {
                document.getElementById("statsBox").style.display = "none";
                document.getElementById("worldInfo").querySelectorAll("p")[0].style.display = "none";
            } else {
                document.getElementById("statsBox").style.display = "";
                document.getElementById("worldInfo").querySelectorAll("p")[0].style.display = "";
            }

            if (data.world) {
                if (isImmersive) {
                    document.getElementById("worldName").textContent = data.world.name;
                    document.getElementById("worldTheme").textContent = data.world.theme;
                    document.getElementById("worldDesc").textContent = data.world.scene_description;
                } else {
                    updateWorldInfo(data.world);
                }
                document.getElementById("sceneName").textContent = data.world.current_scene;
                document.getElementById("sceneDesc").textContent = data.world.scene_description || "";
                document.getElementById("headerSceneName").textContent = "📍 " + data.world.current_scene;
            }

            if (data.player) {
                playerName = data.player.name;
                updatePlayerStats(data.player);
            }

            if (data.npcs) {
                if (isImmersive) {
                    let npcHtml = "";
                    data.npcs.forEach(npc => {
                        const cls = npc.is_alive ? "" : " dead";
                        npcHtml += `<div class="npc-item${cls}">
                            <div class="npc-name">${npc.name}</div>
                            <div class="npc-detail">${npc.appearance || ""}</div>
                        </div>`;
                    });
                    document.getElementById("npcContent").innerHTML = npcHtml || '<p style="color:#aaa;">暂无可见身影</p>';
                } else {
                    updateNPCList(data.npcs);
                }
            }
        });

        socket.on("scene_change", (data) => {
            showToast(`📍 场景切换：${data.new_scene}`);
            document.getElementById("sceneName").textContent = data.new_scene;
            document.getElementById("sceneDesc").textContent = data.description;
            document.getElementById("headerSceneName").textContent = "📍 " + data.new_scene;
            if (data.transition) {
                addNarration(data.transition);
            }
        });

        socket.on("stats_update", (data) => {
            if (data.stats) {
                updatePlayerStats({ stats: data.stats });
            }
            if (data.reason) {
                showToast(`📊 属性变化：${data.reason}`);
            }
        });

        socket.on("plot_event", (data) => {
            if (data.title) {
                addMessage("system", "情节", `⚡ ${data.title}：${data.description}`);
            }
        });

        socket.on("plot_twist", (data) => {
            showToast(`🎲 剧情转折！${data.reason}`);
            if (data.narrator_comment) {
                addNarration(data.narrator_comment, "plot");
            }
        });

        socket.on("novel_chapter", (data) => {
            if (data.chapter_num) {
                showToast(`📖 第${data.chapter_num}章「${data.title}」已生成`);
                document.getElementById("novelBtn").classList.add("has-new");
            }
        });

        socket.on("world_ended", (data) => {
            removeThinking();
            alert(data.message || "世界已终结。");
            document.getElementById("startOverlay").classList.remove("hidden");
            document.getElementById("endWorldBtn").style.display = "none";
            document.getElementById("novelBtn").style.display = "none";
            document.getElementById("nameEditBtn").style.display = "none";
            document.getElementById("messageInput").disabled = true;
            document.getElementById("sendBtn").disabled = true;
            document.getElementById("startBtn").disabled = false;
            document.getElementById("startBtn").textContent = "开始穿越";
            document.getElementById("statsBox").style.display = "";
            document.getElementById("worldInfo").querySelectorAll("p")[0].style.display = "";
            document.getElementById("chatMessages").innerHTML =
                '<div class="message system"><div class="bubble system" style="color:#e94560;">💀 你的旅程以死亡告终。开始新的冒险吧。</div></div>';
            isProcessing = false;
            fetchSavedWorlds();
        });

        socket.on("action_feedback", (data) => {
            if (data.type === "restrained") {
                showToast("⛓️ " + data.message);
            } else if (data.type === "rescued") {
                showToast("🆓 " + data.message);
            }
        });

        socket.on("processing_done", (data) => {
            isProcessing = false;
            removeThinking();
            document.getElementById("sendBtn").disabled = false;
            document.getElementById("messageInput").focus();
            socket.emit("get_state");
        });

        socket.on("error", (data) => {
            isProcessing = false;
            removeThinking();
            document.getElementById("sendBtn").disabled = false;
            alert("错误：" + data.message);
        });

        // 自动调整输入框高度
        document.getElementById("messageInput").addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = Math.min(this.scrollHeight, 120) + "px";
        });
    </script>
    <button class="settings-btn" onclick="openSettings()" title="模型设置">⚙</button>
</body>
</html>
